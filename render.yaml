# Render blueprint for TaskFlow. Not deployed as part of this submission (no
# hosting account is provisioned); documented here as a one-click deploy path.
# See README "Deployment" for the manual/scripted alternative.
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free

services:
  - type: redis
    name: taskflow-redis
    plan: free
    ipAllowList: []

  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: taskflow-worker
    runtime: docker
    plan: free
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: RUN_MIGRATIONS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString

  - type: worker
    name: taskflow-beat
    runtime: docker
    plan: free
    dockerCommand: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    envVars:
      - key: RUN_MIGRATIONS
        value: "0"
      - key: CELERY_BROKER_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: taskflow-redis
          type: redis
          property: connectionString
